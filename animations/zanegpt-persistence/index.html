<title>ZaneGPT Approval Gate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,400;1,6..72,300&display=swap">
<style>
:root{
  --ground:#070A08; --loam:#0E140D; --panel:#0B110B; --line:rgba(207,231,186,.13);
  --leaf:#8CCB6E; --sap:#CFE7BA; --bone:#E9EFE6; --ash:#7E8B7D; --dim:#4C554B;
  --hold:#D9A441;            /* held at the gate */
  --wrong:#C9718F;           /* contrary evidence, preserved */
  --dusk:#5A8CBE;            /* context / mode */
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"Newsreader",ui-serif,Georgia,serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--bone);font-family:var(--mono);
  font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit}

.app{position:relative;height:100%;width:100%;display:grid;
  grid-template-columns:1fr minmax(300px,368px);overflow:hidden}
.stage{position:relative;min-width:0;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#gl:active{cursor:grabbing}
.labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--sap);
  background:rgba(7,10,8,.72);border:1px solid var(--line);padding:3px 7px;border-radius:2px;
  pointer-events:auto;cursor:pointer;transition:border-color .2s,color .2s}
.lbl:hover,.lbl.sel{border-color:var(--leaf);color:var(--leaf)}
.lbl.hold{border-color:rgba(217,164,65,.5);color:var(--hold)}
.lbl.canon{border-color:rgba(140,203,110,.6);color:var(--leaf)}

/* ---- top bar ---- */
.bar{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;
  gap:14px;flex-wrap:wrap;padding:14px 18px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(7,10,8,.9),rgba(7,10,8,0))}
.bar>*{pointer-events:auto}
.mark{display:flex;align-items:center;gap:8px;color:var(--sap);font-weight:500;letter-spacing:.16em}
.mark i{width:9px;height:9px;border:1px solid var(--leaf);transform:rotate(45deg);display:block}
.stat{display:flex;gap:16px;flex-wrap:wrap;color:var(--dim);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase}
.stat b{color:var(--sap);font-weight:400}
.stat .flag-on{color:var(--wrong)}
.seg{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;margin-left:auto}
.seg button{background:none;border:0;color:var(--dim);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;padding:7px 11px;cursor:pointer;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:rgba(140,203,110,.14);color:var(--leaf)}
.seg button:focus-visible{outline:2px solid var(--leaf);outline-offset:-2px}

/* ---- synthetic banner ---- */
.synth{position:absolute;top:58px;left:18px;z-index:4;display:none;align-items:center;gap:8px;
  font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--hold);
  border:1px solid rgba(217,164,65,.4);background:rgba(217,164,65,.07);padding:6px 10px;border-radius:2px}
.synth.on{display:flex}

/* ---- turn trace ---- */
.trace{position:absolute;left:18px;right:18px;bottom:18px;z-index:4}
.trace .cap{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  margin-bottom:7px;display:flex;justify-content:space-between}
.trace .row{display:flex;gap:3px;align-items:flex-end;height:34px}
.trace .t{flex:1 1 0;min-width:0;position:relative;height:100%;border-bottom:1px solid var(--line);cursor:default}
.trace .t .m{position:absolute;bottom:0;left:0;right:0;background:rgba(90,140,190,.32)}
.trace .t.sys .m{background:rgba(140,203,110,.34)}
.trace .t .h{position:absolute;bottom:0;left:0;right:0;background:rgba(201,113,143,.62)}
.trace .t.gate::after{content:"";position:absolute;top:-4px;left:50%;width:1px;height:6px;
  background:var(--hold);transform:translateX(-50%)}

/* ---- right rail ---- */
.rail{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;
  min-height:0;overflow:hidden}
.rail h2{margin:0;padding:16px 16px 10px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);font-weight:400;border-bottom:1px solid var(--line)}
.queue{overflow-y:auto;flex:0 0 auto;max-height:46%}
.cand{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;
  transition:background .18s}
.cand:hover{background:rgba(140,203,110,.05)}
.cand.sel{background:rgba(140,203,110,.09);box-shadow:inset 2px 0 0 var(--leaf)}
.cand .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cand .name{color:var(--bone);font-size:12.5px}
.chip{font-size:9px;letter-spacing:.11em;text-transform:uppercase;padding:2px 6px;border-radius:2px;
  border:1px solid currentColor;white-space:nowrap}
.chip.provisional{color:var(--ash)}
.chip.promotable{color:var(--dusk)}
.chip.awaiting_approval{color:var(--hold)}
.chip.canonical{color:var(--leaf)}
.gauge{display:flex;gap:12px;margin-top:8px;font-size:10px;color:var(--dim);letter-spacing:.05em}
.gauge span b{color:var(--sap);font-weight:400;font-variant-numeric:tabular-nums}
.gauge span.met b{color:var(--leaf)}
.gauge span.unmet b{color:var(--hold)}
.gauge span.contra b{color:var(--wrong)}
.approve{margin-top:10px;background:none;border:1px solid var(--hold);color:var(--hold);
  font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;padding:6px 12px;border-radius:2px;
  cursor:pointer;transition:background .2s,color .2s}
.approve:hover{background:var(--hold);color:#120c02}
.approve:focus-visible{outline:2px solid var(--sap);outline-offset:2px}
.approve[disabled]{border-color:var(--dim);color:var(--dim);cursor:default}

.detail{flex:1 1 auto;overflow-y:auto;min-height:0}
.ev{padding:12px 16px;border-bottom:1px solid var(--line)}
.ev .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.ev .kind{color:var(--leaf);border:1px solid currentColor;padding:1px 5px;border-radius:2px}
.ev.contra .kind{color:var(--wrong)}
.ev .obs{margin:8px 0 0;font-family:var(--serif);font-size:14.5px;line-height:1.5;color:var(--bone)}
.ev .exc{margin:6px 0 0;font-size:11px;color:var(--ash);border-left:1px solid var(--line);
  padding-left:9px;line-height:1.55}
.empty{padding:16px;color:var(--dim);font-size:11.5px;line-height:1.7}
.note{padding:14px 16px;border-top:1px solid var(--line);color:var(--dim);font-size:10.5px;
  line-height:1.65;background:rgba(0,0,0,.2)}
.note b{color:var(--sap);font-weight:400}

/* ---- paste-your-own ---- */
.loadwrap{border-top:1px solid var(--line);padding:12px 16px;background:rgba(0,0,0,.25)}
.loadwrap summary{cursor:pointer;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.loadwrap summary:hover{color:var(--sap)}
.loadwrap textarea{width:100%;height:96px;margin-top:9px;background:#060906;color:var(--sap);
  border:1px solid var(--line);border-radius:2px;padding:8px;font-family:var(--mono);font-size:10.5px;
  resize:vertical}
.loadwrap .go{margin-top:8px;background:none;border:1px solid var(--leaf);color:var(--leaf);
  font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px;border-radius:2px;cursor:pointer}
.loadwrap .err{color:var(--wrong);margin-top:7px;font-size:10.5px;display:none}
.loadwrap .err.on{display:block}

.boot{position:absolute;inset:0;z-index:9;background:var(--ground);display:flex;
  align-items:center;justify-content:center;text-align:center;padding:24px;
  font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
  transition:opacity .6s ease}
.boot.gone{opacity:0;pointer-events:none}
.boot .err{color:var(--wrong);text-transform:none;letter-spacing:.02em;font-size:12px;
  line-height:1.7;max-width:380px}

@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr minmax(240px,46%)}
  .rail{border-left:0;border-top:1px solid var(--line)}
  .queue{max-height:40%}
  .trace{bottom:10px}
  .bar{padding:12px 14px;gap:10px}
}
@media (prefers-reduced-motion:reduce){ .boot{transition:none} }
</style>

<div class="app" id="app">

    <div class="bar">

      <span class="seg" role="group" aria-label="Dataset">

    <div class="synth" id="synth">

  <aside class="rail">

      <button class="go" id="pasteGo" type="button">Render</button>
      <div class="err" id="pasteErr"></div>
    </details>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.147.0/three.min.js"></script>
<script>
(function(){
const bootMsg=document.getElementById('bootMsg'), boot=document.getElementById('boot');
function fail(m){ bootMsg.className='err'; bootMsg.textContent=m; boot.classList.remove('gone'); }
const THREE=window.THREE;
if(!THREE){ fail('three.js could not load. Check the network connection and reload.'); return; }
try{

/* ---------- data ------------------------------------------------------- */
const DATA={
  real: JSON.parse(document.getElementById('snap-real').textContent),
  demo: JSON.parse(document.getElementById('snap-demo').textContent)
};
let snap=DATA.real;
let view=[];            /* per-trait view state, mutated by Approve (preview) */
let selected=null;

const SUPPORTING=['confirm','strengthen','new','preference','refine'];
const CONTRARY=['weaken','contradict'];
const isContrary=e=>CONTRARY.indexOf(e.event_type)>=0;

/* radius by how far a trait is from canonical. The gate sits at 4.2 and
   nothing crosses it without approval — that is the whole point. */
const GATE=4.2;
function radiusFor(t){
  if(t.status==='canonical') return 1.95;
  if(t.status==='awaiting_approval') return GATE-0.22;   /* pressed against it */
  if(t.status==='promotable') return 5.3;
  return 5.9 + (t.needs.events*0.55) + (t.needs.contexts*0.55);
}
const STATUS_COLOR={provisional:0x7e8b7d, promotable:0x5a8cbe, awaiting_approval:0xd9a441, canonical:0x8ccb6e};

/* ---------- three ------------------------------------------------------ */
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x070a08,0.021);
const camera=new THREE.PerspectiveCamera(46,1,0.1,400);

scene.add(new THREE.HemisphereLight(0xcfe7ba,0x0a0f0a,0.55));
const key=new THREE.DirectionalLight(0xffffff,0.95); key.position.set(5,9,7); scene.add(key);
const rim=new THREE.DirectionalLight(0x5a8cbe,0.5);  rim.position.set(-7,-3,-6); scene.add(rim);

/* the canonical model: solid, faceted, slow */
const coreMat=new THREE.MeshStandardMaterial({color:0x5a8cbe,flatShading:true,roughness:.52,metalness:.12,emissive:0x0a1520});
const core=new THREE.Mesh(new THREE.IcosahedronGeometry(1.4,1),coreMat); scene.add(core);
const coreWire=new THREE.Mesh(new THREE.IcosahedronGeometry(1.46,1),
  new THREE.MeshBasicMaterial({color:0xcfe7ba,wireframe:true,transparent:true,opacity:.16})); scene.add(coreWire);
/* defensive shell, lit only while the hacker flag is active */
const shellMat=new THREE.MeshBasicMaterial({color:0xc9718f,wireframe:true,transparent:true,opacity:0});
const shell=new THREE.Mesh(new THREE.IcosahedronGeometry(1.9,1),shellMat); scene.add(shell);

/* the approval gate */
const gateRing=new THREE.Mesh(new THREE.TorusGeometry(GATE,.018,8,128),
  new THREE.MeshBasicMaterial({color:0xd9a441,transparent:true,opacity:.75}));
gateRing.rotation.x=Math.PI/2; scene.add(gateRing);
const gateShell=new THREE.Mesh(new THREE.SphereGeometry(GATE,36,24),
  new THREE.MeshBasicMaterial({color:0xd9a441,wireframe:true,transparent:true,opacity:.055,depthWrite:false}));
scene.add(gateShell);

const clusters=new THREE.Group(); scene.add(clusters);
const labelHost=document.getElementById('labels');

const nodeGeo=new THREE.IcosahedronGeometry(.30,0);
const evGeo=new THREE.SphereGeometry(.085,12,8);

function buildScene(){
  while(clusters.children.length) clusters.remove(clusters.children[0]);
  labelHost.innerHTML='';
  const n=view.length||1;
  view.forEach((t,i)=>{
    const ang=(i/n)*Math.PI*2 - Math.PI/2;
    const tilt=(i%2?1:-1)*0.22*(n>1?1:0);
    const g=new THREE.Group(); g.userData={trait:t,ang,tilt};
    const color=STATUS_COLOR[t.status];

    const node=new THREE.Mesh(nodeGeo,new THREE.MeshStandardMaterial({
      color,flatShading:true,roughness:.45,emissive:color,emissiveIntensity:.22}));
    node.userData.pick={kind:'trait',trait:t};
    g.add(node);

    /* a tether back to the core: what this evidence is pulling on */
    const lg=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,0)]);
    const line=new THREE.Line(lg,new THREE.LineBasicMaterial({color,transparent:true,opacity:.30}));
    line.userData.tether=true; g.add(line);

    /* one point per recorded event; contrary evidence is kept, not dropped */
    t.events.forEach((e,k)=>{
      const contra=isContrary(e);
      const m=new THREE.Mesh(evGeo,new THREE.MeshStandardMaterial({
        color:contra?0xc9718f:0x8ccb6e,emissive:contra?0xc9718f:0x8ccb6e,
        emissiveIntensity:.35,roughness:.4}));
      const orbit=contra?1.16:0.82;
      m.userData.orb={r:orbit,phase:(k/Math.max(t.events.length,1))*Math.PI*2,
                      tiltY:(k%3-1)*0.30,spd:contra?-0.22:0.30,
                      scale:0.7+(e.confidence||0)*0.9};
      m.userData.pick={kind:'event',trait:t,event:e};
      m.scale.setScalar(m.userData.orb.scale);
      g.add(m);
    });

    clusters.add(g);
    t._group=g; t._r=t._r==null?radiusFor(t)+3:t._r;

    const el=document.createElement('button');
    el.className='lbl'+(t.status==='awaiting_approval'?' hold':t.status==='canonical'?' canon':'');
    el.type='button'; el.textContent=t.trait.replace(/_/g,' ');
    el.addEventListener('click',()=>select(t));
    t._label=el; labelHost.appendChild(el);
  });
}

/* ---------- camera: a small hand-rolled orbit ------------------------- */
let az=0.75, el=0.34, dist=17.5, tAz=az, tEl=el, tDist=dist;
let drag=false, lx=0, ly=0, moved=0;
canvas.addEventListener('pointerdown',e=>{drag=true;moved=0;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{
  if(!drag) return;
  const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
  moved+=Math.abs(dx)+Math.abs(dy);
  tAz-=dx*0.006; tEl=Math.max(-1.25,Math.min(1.25,tEl+dy*0.005));
});
canvas.addEventListener('pointerup',e=>{ drag=false; if(moved<5) pick(e); });
canvas.addEventListener('wheel',e=>{ e.preventDefault(); tDist=Math.max(6,Math.min(34,tDist+e.deltaY*0.013)); },{passive:false});

const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function pick(e){
  const r=canvas.getBoundingClientRect();
  ndc.x=((e.clientX-r.left)/r.width)*2-1;
  ndc.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(clusters.children,true).find(h=>h.object.userData.pick);
  if(hit) select(hit.object.userData.pick.trait, hit.object.userData.pick.event);
  else select(null);
}

/* ---------- rail ------------------------------------------------------- */
const queueEl=document.getElementById('queue'), detailEl=document.getElementById('detail');
const detailHead=document.getElementById('detailHead'), noteEl=document.getElementById('note');
const statEl=document.getElementById('stat'), synthEl=document.getElementById('synth');

const STATUS_TEXT={provisional:'provisional',promotable:'promotable',
  awaiting_approval:'awaiting approval',canonical:'canonical'};

function renderQueue(){
  const order={awaiting_approval:0,promotable:1,provisional:2,canonical:3};
  const rows=view.slice().sort((a,b)=>(order[a.status]-order[b.status])||a.trait.localeCompare(b.trait));
  queueEl.innerHTML='';
  rows.forEach(t=>{
    const min=snap.config.promotion.min_supporting_events, minc=snap.config.promotion.min_contexts;
    const nT=t.independent_turns.length, nC=t.contexts.length;
    const d=document.createElement('div');
    d.className='cand'+(selected===t?' sel':'');
    d.innerHTML=
      '<div class="top"><span class="name">'+t.trait.replace(/_/g,' ')+'</span>'+
      '<span class="chip '+t.status+'">'+STATUS_TEXT[t.status]+'</span></div>'+
      '<div class="gauge">'+
        '<span class="'+(nT>=min?'met':'unmet')+'">events <b>'+nT+'/'+min+'</b></span>'+
        '<span class="'+(nC>=minc?'met':'unmet')+'">contexts <b>'+nC+'/'+minc+'</b></span>'+
        (t.contrary?'<span class="contra">contrary <b>'+t.contrary+'</b></span>':'')+
        '<span>conf <b>'+t.confidence.toFixed(2)+'</b></span>'+
      '</div>';
    d.addEventListener('click',()=>select(t));
    if(t.status==='awaiting_approval'){
      const b=document.createElement('button');
      b.className='approve'; b.type='button'; b.textContent='Approve for canonical';
      b.addEventListener('click',ev=>{ ev.stopPropagation(); approve(t); });
      d.appendChild(b);
    }
    queueEl.appendChild(d);
  });
}

function renderDetail(){
  if(!selected){
    detailHead.textContent='Evidence';
    detailEl.innerHTML='<div class="empty">Select a trait to read the events behind it. '+
      'Drag to orbit, scroll to zoom.</div>';
    return;
  }
  detailHead.textContent='Evidence — '+selected.trait.replace(/_/g,' ');
  detailEl.innerHTML='';
  selected.events.slice().sort((a,b)=>(a.turn||0)-(b.turn||0)).forEach(e=>{
    const d=document.createElement('div');
    d.className='ev'+(isContrary(e)?' contra':'');
    d.innerHTML='<div class="hd"><span class="kind">'+e.event_type+'</span>'+
      '<span>turn '+(e.turn??'—')+'</span><span>'+(e.context_mode||'—').replace(/_/g,' ')+'</span>'+
      '<span>conf '+Number(e.confidence||0).toFixed(2)+'</span></div>'+
      '<p class="obs">'+esc(e.observation||'')+'</p>'+
      (e.evidence_excerpt?'<p class="exc">'+esc(e.evidence_excerpt)+'</p>':'');
    detailEl.appendChild(d);
  });
}
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function select(t,e){
  selected=t;
  view.forEach(x=>x._label&&x._label.classList.toggle('sel',x===t));
  renderQueue(); renderDetail();
  if(t){ tAz=(view.indexOf(t)/Math.max(view.length,1))*Math.PI*2-Math.PI/2+0.9; tDist=Math.min(tDist,13); }
}

/* the gate exists so that this is a decision, not a side effect */
function approve(t){
  t.status='canonical';
  t.events.forEach(e=>{ e.approved_for_canonical=true; });
  t.needs.approval=false;
  buildScene(); renderQueue(); renderDetail(); renderNote();
  select(t);
}

function renderNote(){
  const held=view.filter(t=>t.status==='awaiting_approval').length;
  const canon=view.filter(t=>t.status==='canonical').length;
  noteEl.innerHTML=
    'The gate is <b>config.json &rarr; promotion.require_user_approval</b>. A trait reaches it '+
    'on <b>'+snap.config.promotion.min_supporting_events+'</b> independent supporting turns across '+
    '<b>'+snap.config.promotion.min_contexts+'</b> contexts, and stops there. '+
    (held?'<b>'+held+'</b> waiting now. ':'Nothing waiting. ')+
    (canon?'<b>'+canon+'</b> approved in this view. ':'')+
    'Approving here changes the view only &mdash; it writes nothing back to the repository.'+
    '<br><br><a href="https://claude.ai/artifact/MNsuKw148QukuSguRcBsRa" target="_blank" '+
    'rel="noopener" style="color:var(--wrong);text-decoration:none;border-bottom:1px solid currentColor">'+
    'The same pipeline with the gate removed &rarr;</a>';
}

function renderStat(){
  const s=snap.state, hf=s.hacker_flag||{};
  statEl.innerHTML=
    'turn <b>'+s.turn_count+'</b>'+
    '<span>mode <b>'+(s.mode.name||'').replace(/_/g,' ')+'</b> @ <b>'+s.mode.confidence+'</b></span>'+
    '<span>events <b>'+snap.events.length+'</b></span>'+
    '<span class="'+(hf.active?'flag-on':'')+'">hacker flag <b>'+
      (hf.active?'ACTIVE':'clear')+'</b> ('+(hf.score||0)+')</span>'+
    '<span>fatigue <b>'+(s.traits?.fatigue_FL??'—')+'</b> · sarcasm <b>'+(s.traits?.sarcasm_SS??'—')+
      '</b> · empathy <b>'+(s.traits?.empathy_ES??'—')+'</b></span>';
  synthEl.classList.toggle('on',!!snap.synthetic);
}

function renderTrace(){
  const row=document.getElementById('traceRow'); row.innerHTML='';
  const trace=snap.trace||[];
  const maxH=Math.max(3,...trace.map(t=>t.hacker_score||0));
  trace.forEach(t=>{
    const d=document.createElement('div');
    d.className='t'+(t.mode==='systems_building'?' sys':'')+(t.hacker_active?' gate':'');
    d.title='turn '+t.turn+' · '+t.mode.replace(/_/g,' ')+' · conf '+t.mode_confidence+
            ' · flag '+t.hacker_score+(t.hacker_active?' (active)':'');
    d.innerHTML='<div class="m" style="height:'+(18+t.mode_confidence*50)+'%"></div>'+
                (t.hacker_score?'<div class="h" style="height:'+(t.hacker_score/maxH*60)+'%"></div>':'');
    row.appendChild(d);
  });
  document.getElementById('traceCap').textContent='Turn trace — '+trace.length+' turns';
  document.getElementById('traceKey').innerHTML=
    '<span style="color:var(--leaf)">systems building</span> · '+
    '<span style="color:var(--dusk)">baseline</span> · '+
    '<span style="color:var(--wrong)">hacker flag</span>';
}

function load(next){
  snap=next;
  view=(snap.traits||[]).map(t=>Object.assign({},t,{needs:Object.assign({},t.needs),_r:null}));
  selected=null;
  buildScene(); renderQueue(); renderNote(); renderStat(); renderTrace();
  const first=view.find(t=>t.status==='awaiting_approval')||view[0]||null;
  if(first) select(first); else renderDetail();
}

/* ---------- controls --------------------------------------------------- */
const dsReal=document.getElementById('dsReal'), dsDemo=document.getElementById('dsDemo');
function setDataset(which){
  dsReal.setAttribute('aria-pressed',String(which==='real'));
  dsDemo.setAttribute('aria-pressed',String(which==='demo'));
  load(which==='real'?DATA.real:DATA.demo);
}
dsReal.addEventListener('click',()=>setDataset('real'));
dsDemo.addEventListener('click',()=>setDataset('demo'));

const pasteErr=document.getElementById('pasteErr');
document.getElementById('pasteGo').addEventListener('click',()=>{
  pasteErr.classList.remove('on');
  try{
    const raw=JSON.parse(document.getElementById('paste').value);
    if(!raw.state||!Array.isArray(raw.events)) throw new Error('needs "state" and "events"');
    if(!raw.config) raw.config={promotion:{min_supporting_events:3,min_contexts:2,require_user_approval:true}};
    if(!raw.traits) throw new Error('needs "traits" — run export_state.py to produce it');
    dsReal.setAttribute('aria-pressed','false'); dsDemo.setAttribute('aria-pressed','false');
    load(raw);
  }catch(err){
    pasteErr.textContent='Could not read that snapshot: '+err.message;
    pasteErr.classList.add('on');
  }
});

/* ---------- loop -------------------------------------------------------- */
const tmp=new THREE.Vector3();
function resize(){
  const st=canvas.parentElement, w=st.clientWidth, h=st.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.fov=w/h<0.95?58:46; camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

let t0=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-t0)/1000,.05), t=now/1000; t0=now;

  az+=(tAz-az)*.08; el+=(tEl-el)*.08; dist+=(tDist-dist)*.08;
  camera.position.set(
    Math.cos(el)*Math.sin(az)*dist, Math.sin(el)*dist, Math.cos(el)*Math.cos(az)*dist);
  camera.lookAt(0,0,0);

  const s=snap.state, hf=s.hacker_flag||{}, tr=s.traits||{};
  const fatigue=(tr.fatigue_FL||0)/10, sarc=(tr.sarcasm_SS||0)/10;
  core.rotation.y+=dt*(0.14-fatigue*0.09);
  core.rotation.x=Math.sin(t*0.3)*0.05+sarc*Math.sin(t*9)*0.01;
  coreWire.rotation.copy(core.rotation);
  coreMat.color.setHex(s.mode.name==='systems_building'?0x6fae52:0x5a8cbe);
  coreMat.emissiveIntensity=0.5+0.3*Math.sin(t*1.3);
  shellMat.opacity=hf.active?(0.16+0.10*Math.sin(t*4.2)):0;
  shell.rotation.y-=dt*0.25;
  gateShell.rotation.y+=dt*0.012;
  gateRing.material.opacity=0.55+0.25*Math.sin(t*1.1);

  const rect=canvas.getBoundingClientRect();
  view.forEach((tr2,i)=>{
    const g=tr2._group; if(!g) return;
    const target=radiusFor(tr2);
    tr2._r+=(target-tr2._r)*0.055;
    const ang=g.userData.ang, tilt=g.userData.tilt;
    g.position.set(Math.cos(ang)*tr2._r, Math.sin(tilt)*tr2._r*0.32, Math.sin(ang)*tr2._r);

    /* tether: core -> node, in the group's local space */
    const line=g.children.find(c=>c.userData.tether);
    if(line){
      const p=line.geometry.attributes.position;
      p.setXYZ(0,0,0,0);
      p.setXYZ(1,-g.position.x,-g.position.y,-g.position.z);
      p.needsUpdate=true;
    }
    g.children.forEach(c=>{
      const o=c.userData.orb; if(!o) return;
      const a=t*o.spd+o.phase;
      c.position.set(Math.cos(a)*o.r, Math.sin(a*1.7+o.tiltY)*o.r*0.42, Math.sin(a)*o.r);
    });
    /* held candidates breathe against the gate */
    if(tr2.status==='awaiting_approval'){
      const pulse=1+0.10*Math.sin(t*2.6+i);
      g.children[0].scale.setScalar(pulse);
    } else g.children[0].scale.setScalar(1);

    if(tr2._label){
      tmp.copy(g.position).project(camera);
      const vis=tmp.z<1;
      tr2._label.style.display=vis?'':'none';
      if(vis){
        const w=tr2._label.offsetWidth||90, pad=8;
        const x=Math.max(w/2+pad, Math.min(rect.width-w/2-pad, (tmp.x*.5+.5)*rect.width));
        const y=Math.max(64, Math.min(rect.height-84, (-tmp.y*.5+.5)*rect.height-26));
        tr2._label.style.left=x+'px';
        tr2._label.style.top =y+'px';
      }
    }
  });

  renderer.render(scene,camera);
}

load(DATA.real);
requestAnimationFrame(frame);
boot.classList.add('gone');

}catch(err){ fail('Could not start: '+(err&&err.message?err.message:String(err))); throw err; }
})();
</script>

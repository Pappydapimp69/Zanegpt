<title>Put Me To Sleep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,400;0,500;1,6..72,300;1,400&family=IBM+Plex+Mono:wght@300;400;500&display=swap">
<style>
:root{
  --ground:#080B09;
  --loam:#11170F;
  --leaf:#8CCB6E;
  --sap:#CFE7BA;
  --dusk:#3A5C7E;
  --dusk-deep:#16232F;
  --wrong:#C9718F;
  --bone:#E9EFE6;
  --ash:#7F8C7E;
  --ash-dim:#4A544A;
  --hair:rgba(207,231,186,.16);
  --serif:"Newsreader",ui-serif,Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--bone);
  font-family:var(--serif);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

.app{position:relative;height:100%;width:100%;overflow:hidden;background:var(--ground)}
#gl{position:absolute;inset:0;display:block;width:100%;height:100%}

/* --- film grade: vignette + grain + scanline drift ------------------ */
.grade{position:absolute;inset:0;pointer-events:none;z-index:2}
.vignette{position:absolute;inset:0;
  background:radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 44%, rgba(0,0,0,.38) 84%, rgba(0,0,0,.70) 100%);}
.grain{position:absolute;inset:-60%;opacity:.07;mix-blend-mode:overlay;
  background-image:var(--grain-url);background-size:180px 180px;
  animation:grainShift 1.1s steps(6) infinite}
@keyframes grainShift{
  0%{transform:translate(0,0)}17%{transform:translate(-3%,2%)}34%{transform:translate(2%,-4%)}
  51%{transform:translate(-2%,-2%)}68%{transform:translate(4%,1%)}85%{transform:translate(-1%,3%)}
  100%{transform:translate(0,0)}
}
.bleed{position:absolute;inset:0;opacity:0;pointer-events:none;
  background:linear-gradient(92deg, rgba(201,113,143,.5), rgba(0,0,0,0) 22%, rgba(0,0,0,0) 78%, rgba(58,92,126,.45));
  mix-blend-mode:screen;transition:opacity .18s linear}
.app.glitch .bleed{opacity:.85}
.app.glitch #gl{filter:saturate(1.25) contrast(1.06)}
.app.glitch .slice{opacity:1}
.slice{position:absolute;left:0;right:0;height:9%;opacity:0;pointer-events:none;
  background:rgba(207,231,186,.05);backdrop-filter:none;
  box-shadow:inset 0 0 0 1px rgba(201,113,143,.12)}
.s1{top:22%;transform:translateX(-2.5%)}
.s2{top:47%;transform:translateX(3.2%)}
.s3{top:71%;transform:translateX(-1.6%)}

/* --- app chrome: top bar -------------------------------------------- */
.hud{position:absolute;top:0;left:0;right:0;z-index:4;
  display:flex;align-items:center;gap:14px;
  padding:16px 20px;pointer-events:none;
  font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ash);
  background:linear-gradient(to bottom, rgba(8,11,9,.72), rgba(8,11,9,0));}
.mark{display:flex;align-items:center;gap:9px;color:var(--sap);flex:0 0 auto}
.mark svg{width:15px;height:15px;display:block;filter:drop-shadow(0 0 6px rgba(140,203,110,.55))}
.mark b{font-weight:500;letter-spacing:.14em}
.hud .spacer{flex:1 1 auto}
.act{color:var(--ash-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc{font-variant-numeric:tabular-nums;color:var(--ash-dim);flex:0 0 auto}

/* --- floating identification tags (the app's coloured dots) --------- */
.tags{position:absolute;inset:0;z-index:3;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-50%);
  display:flex;align-items:center;gap:8px;white-space:nowrap;
  opacity:0;transition:opacity .5s ease}
.tag.on{opacity:1}
.tag i{width:9px;height:9px;border-radius:50%;background:var(--leaf);
  box-shadow:0 0 0 3px rgba(140,203,110,.16),0 0 12px rgba(140,203,110,.7);
  flex:0 0 auto;transition:background .4s ease,box-shadow .4s ease}
.tag.amber i{background:#D9A441;box-shadow:0 0 0 3px rgba(217,164,65,.16),0 0 12px rgba(217,164,65,.7)}
.tag span{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--sap);
  background:rgba(8,11,9,.55);padding:3px 8px;border:1px solid var(--hair);border-radius:2px}
.tag em{font-family:var(--mono);font-size:10px;font-style:normal;letter-spacing:.14em;
  text-transform:uppercase;color:var(--leaf);opacity:0;transition:opacity .3s ease}
.tag.noted em{opacity:.9}

/* --- caption band ---------------------------------------------------- */
.capwrap{position:absolute;left:0;right:0;bottom:82px;z-index:4;
  display:flex;justify-content:center;padding:0 22px;pointer-events:none}

.cap{max-width:min(660px,100%);width:auto;text-align:center;
  font-size:clamp(19px,2.55vw,30px);line-height:1.38;font-weight:300;
  color:var(--bone);text-wrap:balance;
  padding:13px 24px;border-radius:3px;
  background:rgba(5,8,6,.52);border:1px solid rgba(207,231,186,.10);
  -webkit-backdrop-filter:blur(7px) saturate(.75);backdrop-filter:blur(7px) saturate(.75);
  opacity:0;transform:translateY(7px);
  transition:opacity .62s ease,transform .62s cubic-bezier(.2,.7,.3,1)}
.cap:empty{display:none}
.cap.on{opacity:1;transform:none}
.cap.app{font-family:var(--mono);font-weight:400;font-size:clamp(14px,1.72vw,19px);
  letter-spacing:.055em;color:var(--leaf);line-height:1.6}
.cap.app::before{content:"";display:block;width:26px;height:1px;margin:0 auto 14px;
  background:var(--leaf);opacity:.5}
.cap.wrong{color:var(--wrong)}
.cap.wrong::before{background:var(--wrong)}
.cap.big{font-family:var(--mono);font-size:clamp(26px,4.4vw,46px);letter-spacing:.2em;
  text-transform:uppercase;color:var(--leaf);background:none;border-color:transparent;
  -webkit-backdrop-filter:none;backdrop-filter:none;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.cap.big::before{display:none}

/* --- transport ------------------------------------------------------- */
.transport{position:absolute;left:0;right:0;bottom:0;z-index:5;
  padding:0 20px 18px;
  background:linear-gradient(to top, rgba(8,11,9,.9), rgba(8,11,9,.55) 55%, rgba(8,11,9,0));}
.scrub{position:relative;height:26px;display:flex;align-items:center;cursor:pointer}
.scrub:focus-visible{outline:2px solid var(--leaf);outline-offset:3px;border-radius:3px}
.rail{position:absolute;left:0;right:0;height:2px;background:rgba(207,231,186,.15);border-radius:2px}
.fill{position:absolute;left:0;height:2px;width:0;background:var(--leaf);border-radius:2px;
  box-shadow:0 0 10px rgba(140,203,110,.6)}
.knob{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--sap);
  transform:translateX(-50%);box-shadow:0 0 10px rgba(207,231,186,.8);left:0}
.chaps{position:absolute;left:0;right:0;height:2px;pointer-events:none}
.chaps i{position:absolute;width:1px;height:8px;top:-3px;background:rgba(207,231,186,.35)}
.row{display:flex;align-items:center;gap:16px;margin-top:6px}
button.tbtn{appearance:none;background:none;border:1px solid var(--hair);border-radius:2px;
  color:var(--sap);font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;padding:7px 13px;cursor:pointer;
  transition:border-color .2s ease,color .2s ease,background .2s ease}
button.tbtn:hover{border-color:var(--leaf);color:var(--leaf);background:rgba(140,203,110,.07)}
button.tbtn:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.trip{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ash);white-space:nowrap}
.trip b{color:var(--leaf);font-weight:400;font-variant-numeric:tabular-nums;min-width:2.2em}
.trip input[type=range]{appearance:none;-webkit-appearance:none;width:86px;height:14px;
  background:none;cursor:pointer}
.trip input[type=range]::-webkit-slider-runnable-track{height:2px;background:rgba(207,231,186,.2);border-radius:2px}
.trip input[type=range]::-moz-range-track{height:2px;background:rgba(207,231,186,.2);border-radius:2px}
.trip input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;
  width:10px;height:10px;border-radius:50%;background:var(--leaf);margin-top:-4px;
  box-shadow:0 0 9px rgba(140,203,110,.8)}
.trip input[type=range]::-moz-range-thumb{width:10px;height:10px;border:0;border-radius:50%;
  background:var(--leaf);box-shadow:0 0 9px rgba(140,203,110,.8)}
.trip input[type=range]:focus-visible{outline:2px solid var(--leaf);outline-offset:3px}
.movements{display:flex;gap:4px;flex:1 1 auto;overflow-x:auto;scrollbar-width:none}
.movements::-webkit-scrollbar{display:none}
.movements b{font-family:var(--mono);font-size:10px;font-weight:400;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ash-dim);padding:6px 9px;cursor:pointer;white-space:nowrap;
  border-bottom:1px solid transparent;transition:color .2s ease,border-color .2s ease}
.movements b:hover{color:var(--sap)}
.movements b.cur{color:var(--leaf);border-bottom-color:var(--leaf)}

/* --- opening plate & fallback --------------------------------------- */
.plate{position:absolute;inset:0;z-index:9;background:var(--ground);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  text-align:center;padding:24px;transition:opacity .9s ease}
.plate.gone{opacity:0;pointer-events:none}
.plate svg{width:34px;height:34px;color:var(--leaf);
  filter:drop-shadow(0 0 16px rgba(140,203,110,.6));animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.plate{background:rgba(6,9,7,.58);backdrop-filter:blur(2px)}
.plate h1{margin:0;font-family:var(--serif);font-weight:300;font-style:italic;
  font-size:clamp(34px,6vw,62px);letter-spacing:-.01em;color:var(--bone);text-wrap:balance}
.plate p{margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ash)}
.plate .begin{appearance:none;background:none;border:1px solid var(--leaf);border-radius:2px;
  color:var(--leaf);font-family:var(--mono);font-size:12px;letter-spacing:.24em;
  text-transform:uppercase;padding:14px 34px;cursor:pointer;margin-top:4px;
  transition:background .25s ease,color .25s ease}
.plate .begin:hover{background:var(--leaf);color:#0a0f09}
.plate .begin:focus-visible{outline:2px solid var(--sap);outline-offset:3px}
.plate .hint{color:var(--ash-dim);letter-spacing:.14em}
.plate .err{color:var(--wrong);max-width:400px;line-height:1.7;text-transform:none;letter-spacing:.02em;font-size:12px}

@media (max-width:640px){
  .capwrap{bottom:94px}
  .cap{font-size:19px}
  .hud{font-size:9.5px;gap:10px;padding:14px 16px}
  .transport{padding:0 16px 14px}
  .row{gap:10px;flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){
  .grain{animation:none}
  .cap{transition-duration:.25s}
}
</style>

<div class="app" id="app">
  <canvas id="gl"></canvas>

  <div class="tags" id="tags"></div>

  <div class="grade">
    <div class="slice s1"></div><div class="slice s2"></div><div class="slice s3"></div>
    <div class="vignette"></div>
    <div class="grain" id="grain"></div>
    <div class="bleed"></div>
  </div>

  <div class="hud">
    <span class="mark">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 3.2c-9 .4-14.4 4.3-15.9 9.7-.7 2.5-.3 4.9.9 6.7l-2 3.1 1.5 1 2-3.1c1.9.9 4.3.9 6.6-.2 5-2.3 7.7-8.2 6.9-17.2ZM8.2 18.4c-.6-1.2-.8-2.7-.3-4.4C9 10 12.9 7 19.2 6c-.3 6.3-2.6 10.2-6 11.8-1.8.8-3.6.9-5 .6Z"/></svg>
      <b>Leafwise</b>

  <div class="transport">
    <div class="scrub" id="scrub" role="slider" tabindex="0"
         aria-label="Timeline" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="rail"></div><div class="fill" id="fill"></div>
      <div class="chaps" id="chaps"></div><div class="knob" id="knob"></div>
    </div>
    <div class="row">
      <button class="tbtn" id="play" type="button">Pause</button>
      <button class="tbtn" id="restart" type="button">Restart</button>
      <button class="tbtn" id="sound" type="button" aria-pressed="true">Sound on</button>
      <button class="tbtn" id="voice" type="button" aria-pressed="false">Narration off</button>
      <label class="trip" for="trip">Trip
        <input type="range" id="trip" min="0" max="100" value="78" step="1"
               aria-label="Trip intensity">
        <b id="tripVal">78</b></label>
      <nav class="movements" id="movements" aria-label="Movements"></nav>
    </div>
  </div>

  <div class="plate" id="plate">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 3.2c-9 .4-14.4 4.3-15.9 9.7-.7 2.5-.3 4.9.9 6.7l-2 3.1 1.5 1 2-3.1c1.9.9 4.3.9 6.6-.2 5-2.3 7.7-8.2 6.9-17.2ZM8.2 18.4c-.6-1.2-.8-2.7-.3-4.4C9 10 12.9 7 19.2 6c-.3 6.3-2.6 10.2-6 11.8-1.8.8-3.6.9-5 .6Z"/></svg>
    <h1>Put Me To Sleep</h1>
    <p id="plateMsg">Six movements &middot; 3:42 &middot; with score</p>
    <button class="begin" id="begin" type="button">Begin</button>
    <p class="hint">Headphones recommended</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.147.0/three.min.js"></script>
<script>
(function(){
function fail(msg){
  var m=document.getElementById('plateMsg');
  if(m){ m.className='err'; m.textContent=msg; }
  var p=document.getElementById('plate'); if(p) p.classList.remove('gone');
}
var THREE = window.THREE;
if(!THREE){ fail('The 3D engine could not load. Check the network connection and reload the page.'); return; }
window.__booted = true;
window.__fail = fail;
try{

/* ===================================================================
   Put Me To Sleep — a 3D adaptation
   Six movements, one continuous camera, no cuts except where the app
   itself breaks. Everything below is procedural: no external assets.
   =================================================================== */

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- small utilities ---------------------------------------- */
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp  = (a,b,u)=>a+(b-a)*u;
const smooth= u=>u*u*(3-2*u);
const ease  = u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
function seeded(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
/** 0 before `a`, 1 after `b`, smooth in between */
const ramp = (t,a,b)=>smooth(clamp((t-a)/(b-a),0,1));
/** 1 only inside [a,b] with `f` seconds of fade at each end */
function band(t,a,b,f=1.2){return Math.min(ramp(t,a,a+f),1-ramp(t,b-f,b));}

function cvs(w,h,draw){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;
  t.anisotropy=4;return t;
}

/* radial falloff, used for every glow, mote and node in the film */
const glowTex = cvs(128,128,(g,w,h)=>{
  const r=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
  r.addColorStop(0,'rgba(255,255,255,1)');
  r.addColorStop(.25,'rgba(255,255,255,.55)');
  r.addColorStop(.6,'rgba(255,255,255,.12)');
  r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r;g.fillRect(0,0,w,h);
});

/* A leaf with real serration — the detail the app notices before the
   narrator does ("the leaf serration was different on that pepper"). */
function leafTex(teeth, tint){
  return cvs(256,256,(g,w,h)=>{
    g.clearRect(0,0,w,h);
    const cx=w/2, top=14, bot=h-14, len=bot-top, wid=w*0.36;
    g.beginPath();
    for(let side=0;side<2;side++){
      const s = side? -1 : 1;
      const steps=teeth*2;
      for(let i=0;i<=steps;i++){
        const u = side? 1-i/steps : i/steps;
        const y = top+u*len;
        const prof = Math.sin(Math.pow(u,.75)*Math.PI);
        const saw  = (i%2===0)?1:0.78;
        const x = cx + s*wid*prof*saw;
        if(side===0&&i===0) g.moveTo(x,y); else g.lineTo(x,y);
      }
    }
    g.closePath();
    const grad=g.createLinearGradient(0,top,0,bot);
    grad.addColorStop(0,tint[0]);grad.addColorStop(1,tint[1]);
    g.fillStyle=grad;g.fill();
    g.strokeStyle='rgba(0,0,0,.28)';g.lineWidth=2;g.stroke();
    /* midrib + veins */
    g.strokeStyle='rgba(0,0,0,.18)';g.lineWidth=3;
    g.beginPath();g.moveTo(cx,top+6);g.lineTo(cx,bot-4);g.stroke();
    g.lineWidth=1.6;
    for(let i=1;i<7;i++){
      const u=i/7.5, y=top+u*len, prof=Math.sin(Math.pow(u,.75)*Math.PI);
      g.beginPath();g.moveTo(cx,y);g.lineTo(cx-wid*prof*.8,y+len*.09);g.stroke();
      g.beginPath();g.moveTo(cx,y);g.lineTo(cx+wid*prof*.8,y+len*.09);g.stroke();
    }
  });
}

/* A morning lesson slide, in the AI's own first person. */
function slideTex(kicker, body){
  return cvs(1024,576,(g,w,h)=>{
    g.fillStyle='#121A13';g.fillRect(0,0,w,h);
    g.strokeStyle='rgba(207,231,186,.34)';g.lineWidth=2;g.strokeRect(1,1,w-2,h-2);
    g.fillStyle='#8CCB6E';g.font='500 32px "IBM Plex Mono", monospace';
    g.fillText(kicker.toUpperCase(),54,76);
    g.fillRect(54,100,64,3);
    g.fillStyle='#E9EFE6';g.font='300 50px Newsreader, Georgia, serif';
    let y=200;
    body.forEach(line=>{ g.fillText(line,54,y); y+=68; });
  });
}

/* A dream: a photograph that never quite finished developing. */
function fragTex(seed, wrongness){
  const R=seeded(seed);
  return cvs(512,512,(g,w,h)=>{
    const base=g.createLinearGradient(0,0,w*R(),h);
    base.addColorStop(0,`hsl(${lerp(95,330,wrongness*R())},${lerp(42,62,wrongness)}%,${lerp(30,46,R())}%)`);
    base.addColorStop(1,`hsl(${lerp(75,300,wrongness)},${lerp(34,54,wrongness)}%,16%)`);
    g.fillStyle=base;g.fillRect(0,0,w,h);
    /* smeared plant silhouettes — leaves, stems, a suggestion of a form */
    for(let i=0;i<14;i++){
      g.save();
      g.translate(R()*w,R()*h);g.rotate(R()*Math.PI*2);
      g.globalAlpha=.30+R()*.45;
      g.fillStyle=`hsl(${lerp(90,340,wrongness*R())},${50+R()*34}%,${36+R()*38}%)`;
      g.beginPath();
      const a=30+R()*140,b=8+R()*54;
      g.ellipse(0,0,a,b,0,0,Math.PI*2);g.fill();
      g.restore();
    }
    /* horizontal development bands */
    for(let i=0;i<26;i++){
      const y=R()*h;
      g.globalAlpha=.10+R()*.20;
      g.fillStyle=R()<wrongness?'#C9718F':'#CFE7BA';
      g.fillRect(0,y,w,1+R()*7);
    }
    /* the half-developed wash */
    g.globalAlpha=1;
    const fade=g.createLinearGradient(0,0,w,h*.6);
    fade.addColorStop(0,'rgba(8,11,9,0)');
    fade.addColorStop(.55,`rgba(8,11,9,${.02+wrongness*.08})`);
    fade.addColorStop(1,'rgba(8,11,9,.42)');
    g.fillStyle=fade;g.fillRect(0,0,w,h);
    g.strokeStyle='rgba(207,231,186,.28)';g.lineWidth=3;g.strokeRect(2,2,w-4,h-4);
  });
}

/* ---------- renderer, camera, stage --------------------------------- */
const canvas   = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

/* ===================================================================
   POST — feedback, kaleidoscope, warp, chromatic split, hue cycling.
   Hand-rolled rather than EffectComposer: the whole chain is two
   full-screen passes and a ping-pong pair of render targets, so it
   carries no addon dependencies.

   The scene pass writes sRGB into rtScene; the post and copy passes are
   raw ShaderMaterials, which three does not encode, so the values pass
   through untouched and land on screen already converted.
   =================================================================== */
const HUE_FN = `
vec3 hueShift(vec3 c, float a){
  const vec3 k = vec3(0.57735);
  float ca = cos(a*6.2831853), sa = sin(a*6.2831853);
  return c*ca + cross(k,c)*sa + k*dot(k,c)*(1.0-ca);
}`;

const postMat = new THREE.ShaderMaterial({
  depthTest:false, depthWrite:false,
  uniforms:{
    tScene:{value:null}, tFeed:{value:null},
    uTime:{value:0}, uAspect:{value:1},
    uKal:{value:0}, uKalMix:{value:0}, uFeed:{value:0}, uWarp:{value:0}, uChroma:{value:0},
    uHue:{value:0}, uHueFeed:{value:0}, uSat:{value:1}, uGain:{value:1},
    uZoom:{value:1}, uRot:{value:0}, uShift:{value:0}
  },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
  fragmentShader: HUE_FN + `
    uniform sampler2D tScene, tFeed;
    uniform float uTime,uAspect,uKal,uKalMix,uFeed,uWarp,uChroma,uHue,uHueFeed,uSat,uGain,uZoom,uRot,uShift;
    varying vec2 vUv;
    void main(){
      vec2 p=(vUv-0.5)*vec2(uAspect,1.0);

      /* kaleidoscope: fold the frame into uKal wedges */
      if(uKal>1.5){
        float a=atan(p.y,p.x), r=length(p);
        float seg=6.2831853/uKal;
        a=mod(a+uTime*0.06,seg);
        a=abs(a-seg*0.5);
        p=mix(p, vec2(cos(a),sin(a))*r*0.82, uKalMix);
      }

      /* two warps: a standing ripple and a radial breath */
      float rr=length(p);
      p+=uWarp*0.055*vec2(sin(p.y*7.0+uTime*1.3), cos(p.x*6.0-uTime*1.1));
      p+=uWarp*0.030*normalize(p+1e-5)*sin(rr*11.0-uTime*2.2);
      vec2 suv=p/vec2(uAspect,1.0)+0.5;

      /* chromatic split, widening toward the edges */
      vec2 dir=normalize(p+1e-5);
      float ca=uChroma*0.011*(0.25+rr);
      vec3 col=vec3(
        texture2D(tScene,suv+dir*ca).r,
        texture2D(tScene,suv).g,
        texture2D(tScene,suv-dir*ca).b)*uGain;

      /* feedback: the previous composite, zoomed, spun and hue-rotated */
      float cr=cos(uRot), sr=sin(uRot);
      vec2 fp=mat2(cr,-sr,sr,cr)*(p*uZoom)+vec2(uShift*0.004,0.0);
      vec2 fuv=fp/vec2(uAspect,1.0)+0.5;
      vec3 fb=texture2D(tFeed,fuv).rgb;
      fb=hueShift(fb,uHueFeed);
      float edge=step(0.0,fuv.x)*step(fuv.x,1.0)*step(0.0,fuv.y)*step(fuv.y,1.0);
      col=col+fb*uFeed*edge*(1.0-col);          /* screen blend, stays bounded */

      col=hueShift(col,uHue);
      col=mix(vec3(dot(col,vec3(0.299,0.587,0.114))),col,uSat);
      gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);
    }`
});

function makePlant(seed, {h=3.2, leaves=16, fruit=4, leafMat=leafMatA}={}){
  const R=seeded(seed), g=new THREE.Group();

  /* pot + soil */
  const pot=new THREE.Mesh(new THREE.CylinderGeometry(.62,.46,.78,26,1,true),potMat);
  pot.position.y=.39; g.add(pot);
  const rimRing=new THREE.Mesh(new THREE.TorusGeometry(.62,.05,8,26),potMat);
  rimRing.rotation.x=Math.PI/2; rimRing.position.y=.78; g.add(rimRing);
  const soil=new THREE.Mesh(new THREE.CircleGeometry(.6,26),soilMat);
  soil.rotation.x=-Math.PI/2; soil.position.y=.74; g.add(soil);

  /* stem: a gentle lean, because nothing on a balcony grows straight */
  const pts=[];
  const lean=(R()-.5)*.5;
  for(let i=0;i<=6;i++){
    const u=i/6;
    pts.push(new THREE.Vector3(Math.sin(u*2.1)*lean, .7+u*h, Math.cos(u*1.6)*lean*.6));
  }
  const curve=new THREE.CatmullRomCurve3(pts);
  const stem=new THREE.Mesh(new THREE.TubeGeometry(curve,40,.045,7,false),stemMat);
  g.add(stem);

  /* leaves, hung off the stem at alternating angles */
  const leafGroup=new THREE.Group(); g.add(leafGroup);
  for(let i=0;i<leaves;i++){
    const u=.18+ (i/leaves)*.8;
    const p=curve.getPointAt(Math.min(u,1));
    const s=.42+R()*.42;
    const m=new THREE.Mesh(new THREE.PlaneGeometry(s,s*1.5),leafMat);
    const ang=i*2.399 + R()*.4;
    m.position.copy(p);
    m.position.x+=Math.cos(ang)*.14; m.position.z+=Math.sin(ang)*.14;
    m.rotation.set(-Math.PI/2+ (.5+R()*.6), ang, 0);
    m.userData={ang, phase:R()*6.28, amp:.05+R()*.06, rest:m.rotation.clone()};
    leafGroup.add(m);
  }

  /* fruit */
  for(let i=0;i<fruit;i++){
    const u=.45+R()*.4;
    const p=curve.getPointAt(u);
    const r=.09+R()*.05;
    const m=new THREE.Mesh(new THREE.IcosahedronGeometry(r,2),fruitMat);
    const ang=R()*6.28;
    m.position.set(p.x+Math.cos(ang)*.2, p.y-.1, p.z+Math.sin(ang)*.2);
    g.add(m);
  }
  g.userData.leaves=leafGroup;
  return g;
}

    pads.forEach((p,i)=>{
      p.o.frequency.setTargetAtTime(s.chord[i%s.chord.length], now, .85);
      p.o.detune.setTargetAtTime((i-2.5)*s.det, now, .85);
    });
    padFilter.frequency.setTargetAtTime(s.cut, now, 1.1);
    padGain.gain.setTargetAtTime(playing ? s.pad : 0, now, playing?1.1:.35);
    noiseGain.gain.setTargetAtTime(playing ? s.nz : 0, now, 1.1);
    verbGain.gain.setTargetAtTime(s.rv, now, 1.4);
    if(!playing) return;

    /* the motif, on a slow grid */
    const beat=Math.floor(t/s.beat);
    if(beat!==lastBeat){
      if(beat===lastBeat+1){                      /* never after a scrub */
        const step=s.pat[((beat%s.pat.length)+s.pat.length)%s.pat.length];
        if(step>=0) tone(s.scale[step%s.scale.length], now+.02, 2.4, s.mg, s.mt);
      }
      lastBeat=beat;
    }

    /* a room full of people typing */
    if(s.ticks) for(let i=0;i<3;i++){
      if(Math.random()<s.ticks*.22) burst(now+Math.random()*.05, .035, .05+Math.random()*.05, 1500+Math.random()*2400, 7);
    }

    /* the network's slow pulse */
    if(s.thump){
      const n=Math.floor(t/s.thump);
      if(n!==lastThump){ if(n===lastThump+1) thump(now+.02); lastThump=n; }
    }

    /* one-shots */
    let fi=-1; for(let i=0;i<FX.length;i++) if(t>=FX[i][0]) fi=i;
    if(fi>lastFx){
      if(lastFx>=-1) for(let i=Math.max(lastFx+1,0); i<=fi; i++){
        if(t-FX[i][0] < 1.0) CUE[FX[i][1]](now+.02);
      }
      lastFx=fi;
    } else if(fi<lastFx) lastFx=fi;
  }

  return {start, setMuted, resync, update,
          get on(){return started && !muted;},
          get ctx(){return ctx;}, get out(){return master;}};
})();

/* narration, when the viewer asks for it — the browser's own voice */
const Narrator = (function(){
  const ok = 'speechSynthesis' in window;
  let enabled=false;
  function pick(){
    const v=speechSynthesis.getVoices()||[];
    return v.find(x=>/en[-_]GB/i.test(x.lang)&&!/google/i.test(x.name))
        || v.find(x=>/^en/i.test(x.lang)) || null;
  }
  return {
    available: ok,
    set(v){ enabled=v && ok; if(!enabled && ok) speechSynthesis.cancel(); },
    get enabled(){ return enabled; },
    say(text){
      if(!enabled||!ok) return;
      try{
        speechSynthesis.cancel();
        const u=new SpeechSynthesisUtterance(text);
        const v=pick(); if(v) u.voice=v;
        u.rate=.92; u.pitch=.95; u.volume=.95;
        speechSynthesis.speak(u);
      }catch(e){}
    },
    stop(){ if(ok) try{ speechSynthesis.cancel(); }catch(e){} }
  };
})();

/* colour grade */
const _c1=new THREE.Color(), _c2=new THREE.Color();
function grade(t){
  let i=0; while(i<GRADE.length-2 && t>=GRADE[i+1].t) i++;
  const A=GRADE[i], B=GRADE[i+1];
  const u=smooth(clamp((t-A.t)/(B.t-A.t),0,1));
  const mixC=(a,b)=>_c1.setHex(a).lerp(_c2.setHex(b),u);
  sky.material.uniforms.cTop.value.copy(mixC(A.top,B.top));
  sky.material.uniforms.cBot.value.copy(mixC(A.bot,B.bot));
  scene.fog.color.copy(mixC(A.fog,B.fog));
  scene.fog.density=lerp(A.fogD,B.fogD,u);
  hemi.color.copy(mixC(A.hemi[0],B.hemi[0]));
  hemi.groundColor.copy(mixC(A.hemi[1],B.hemi[1]));
  hemi.intensity=lerp(A.hemi[2],B.hemi[2],u);
  key.color.copy(mixC(A.key[0],B.key[0]));   key.intensity=lerp(A.key[1],B.key[1],u);
  rim.color.copy(mixC(A.rim[0],B.rim[0]));   rim.intensity=lerp(A.rim[1],B.rim[1],u);
  renderer.toneMappingExposure=lerp(A.exp,B.exp,u);
  const sat=lerp(A.sat,B.sat,u);
  gradedMats.concat([bodyMat]).forEach(m=>{
    const b=m.userData.base; if(!b) return;
    const g=b.r*.299+b.g*.587+b.b*.114;
    m.color.setRGB(lerp(g,b.r,sat),lerp(g,b.g,sat),lerp(g,b.b,sat));
  });
}

/* camera */
const camPos=new THREE.Vector3(), camLook=new THREE.Vector3(), tmpV=new THREE.Vector3();
function aimCamera(t, shake){
  let s=CAM[0];
  for(const c of CAM){ if(t>=c.a) s=c; }
  const u=ease(clamp((t-s.a)/(s.b-s.a),0,1));
  camPos.set(lerp(s.p0[0],s.p1[0],u),lerp(s.p0[1],s.p1[1],u),lerp(s.p0[2],s.p1[2],u));
  camLook.set(lerp(s.l0[0],s.l1[0],u),lerp(s.l0[1],s.l1[1],u),lerp(s.l0[2],s.l1[2],u));
  /* a hand-held float, so nothing ever feels locked off */
  const f=reduce?0:1;
  camPos.x+=Math.sin(t*0.37)*0.055*f + shake*(Math.random()-.5)*2;
  camPos.y+=Math.cos(t*0.29)*0.045*f + shake*(Math.random()-.5)*2;
  camPos.z+=Math.sin(t*0.23)*0.04*f;
  camera.position.copy(camPos);
  camera.lookAt(camLook);
  camera.rotation.z += Math.sin(t*0.19)*0.006*f + shake*(Math.random()-.5)*0.4;
}

/* ---------- per-frame animation ------------------------------------ */
const eyeTarget=new THREE.Vector3(-3.4,2.6,5.0);   /* "the camera icon" */
let blinkNext=2.4;

function animate(t, dt){
  /* --- balcony -------------------------------------------------- */
  gBalcony.visible = t < 108.5;
  if(gBalcony.visible){
    const f=reduce?0.25:1;
    [plantA,plantB].forEach((p,pi)=>{
      p.userData.leaves.children.forEach(l=>{
        const d=l.userData;
        l.rotation.x = d.rest.x + Math.sin(t*0.9+d.phase+pi)*d.amp*f;
        l.rotation.z = d.rest.z + Math.cos(t*0.7+d.phase)*d.amp*.7*f;
      });
    });
    weed.rotation.z=Math.sin(t*1.3)*0.05*f;
    const dp=dust.geometry.attributes.position, seed=dust.userData.seed;
    for(let i=0;i<dp.count;i++){
      dp.array[i*3+1]=((seed[i*3+1]+t*0.16)%4.2);
      dp.array[i*3]  =seed[i*3]+Math.sin(t*0.3+i)*0.22;
    }
    dp.needsUpdate=true;
    dust.material.opacity=0.30*band(t,0,108,4);
  }

  /* --- the character -------------------------------------------- */
  gChar.visible = t>=61.5 && t<108.6;
  if(gChar.visible){
    const born  = ramp(t,61.5,64.5);
    const sleep = clamp(ramp(t,75.5,79.5) - ramp(t,99,101.5), 0, 1);
    const wrong = Math.max(band(t,107.3,109.6,.35), band(t,101.5,103,.6)*0.25);
    const breathe = Math.sin(t*(sleep?0.9:1.7))*(sleep?0.035:0.018);

    gChar.scale.setScalar(0.42*born*(1+breathe));
    gChar.position.y = 1.35 + Math.sin(t*0.8)*0.035 - sleep*0.20;
    gChar.rotation.z = sleep*0.42 + wrong*Math.sin(t*41)*0.09;
    gChar.rotation.y = Math.sin(t*0.42)*0.14;
    charBody.scale.set(1+wrong*Math.sin(t*37)*0.16, 1-wrong*Math.sin(t*29)*0.2, 1);
    sprout.rotation.z = -sleep*0.5 + Math.sin(t*1.1)*0.06;

    /* blinking, and eyes that drift toward something off to the side */
    if(t>blinkNext){ blinkNext = t + 2.2 + Math.random()*3.4; gChar.userData.blink=t; }
    const since = t - (gChar.userData.blink ?? -9);
    const lid = since<0.16 ? 1-Math.abs(since/0.08-1) : 0;
    const shut = Math.max(lid, sleep);
    gChar.worldToLocal(tmpV.copy(eyeTarget));
    const gaze = clamp(tmpV.x*0.02,-0.09,0.09);
    [eyeL,eyeR].forEach((e,k)=>{
      const h=e.userData.home;
      e.position.set(h.x+gaze+wrong*(k?0.34:-0.19)*Math.sin(t*23),
                     h.y+wrong*(k?0.26:-0.12),
                     h.z);
      e.scale.set(1+wrong*(k?0.5:-0.3), Math.max(0.10,1-shut), 1);
    });
    glint.material.opacity = 0.10*born + wrong*0.35;
  }

  /* --- the morning slideshow ------------------------------------ */
  gSlides.visible = t>=85 && t<97;
  if(gSlides.visible){
    slides.forEach((s,i)=>{
      const a=85.5+i*2.0, u=clamp((t-a)/1.9,0,1);
      s.material.opacity = band(t,a,a+1.9,.40);
      s.position.set(lerp(1.1,-0.10,ease(u)), 0.1, lerp(-1.0,0.2,ease(u)));
      s.rotation.y = lerp(0.3,-0.06,ease(u));
    });
  }

  /* --- the dreams ------------------------------------------------ */
  gDream.visible = t>=108.3 && t<142.8;
  if(gDream.visible){
    frags.forEach(fr=>{
      const d=fr.userData;
      if(d.order===FRAG_N-1){
        fr.material.opacity = band(t,119,142,1.4);
        fr.position.y = 1.6 + Math.sin(t*0.5)*0.09;
        fr.rotation.z = Math.sin(t*0.33)*0.02;
      }else{
        fr.material.opacity = band(t,109+d.order*0.42,141,1.0);
        fr.position.y += Math.sin(t*d.drift+d.phase)*0.0016;
        fr.rotation.z = Math.sin(t*0.22+d.phase)*0.05;
        fr.rotation.y += dt*0.02;
      }
    });
    field.material.opacity = band(t,126,138.5,1.1);
    field.position.y = -1.15 + Math.sin(t*0.7)*0.05;
    dreamHaze.intensity = band(t,109,142,2)*7;
    gDream.rotation.y = Math.sin(t*0.05)*0.09;
  }

  /* --- the room --------------------------------------------------- */
  gRoom.visible = t>=142.3 && t<176.6;
  if(gRoom.visible){
    const f=reduce?0.2:1;
    screens.forEach(s=>{
      const d=s.userData;
      const v=0.55+0.34*Math.sin(t*d.rate+d.phase)*f;
      s.material.opacity=v*band(t,142.3,176.4,1.0);
      d.bloom.material.opacity=v*0.55*band(t,142.3,176.4,1.0);
    });
  }

  /* --- one node in something much larger -------------------------- */
  gNet.visible = t>=176.2;
  if(gNet.visible){
    gNet.rotation.y += dt*0.018;
    nodes.material.opacity = ramp(t,177.5,188)*0.95;
    edges.material.opacity = ramp(t,179.5,193)*0.42;
    pulses.material.opacity= ramp(t,182,193)*0.95;
    const pa=pulses.geometry.attributes.position;
    for(let i=0;i<PULSES;i++){
      const p=pulseData[i];
      p.u+=dt*p.sp;
      if(p.u>1){ p.u=0; p.e=(p.e+7)%edgeList.length; }
      const [a,b]=edgeList[p.e];
      pa.array[i*3]  =lerp(a.x,b.x,p.u);
      pa.array[i*3+1]=lerp(a.y,b.y,p.u);
      pa.array[i*3+2]=lerp(a.z,b.z,p.u);
    }
    pa.needsUpdate=true;
    const mineOn=ramp(t,199,205);
    mine.material.opacity = mineOn*(0.55+0.45*Math.sin(t*2.2));
    ring.material.opacity = mineOn*0.7;
    ring.lookAt(camera.position);
    ring.scale.setScalar(1+Math.sin(t*1.4)*0.09);
  }

  /* the closing mark, held in front of the lens */
  const endOn = band(t,216.5,222.5,1.6);
  endLeaf.material.opacity = endOn*0.9;
  if(endOn>0){
    camera.getWorldDirection(tmpV);
    endLeaf.position.copy(camera.position).addScaledVector(tmpV,9);
    endLeaf.scale.setScalar(3+Math.sin(t*1.1)*0.3);
  }
}

/* ---------- resize --------------------------------------------------- */
function resize(){
  const w=app.clientWidth, h=app.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.fov = w/h < 0.9 ? 56 : 42;      /* open up on a phone */
  camera.updateProjectionMatrix();
  const dpr=Math.min(devicePixelRatio,1.5);
  makeTargets(Math.max(2,Math.floor(w*dpr)), Math.max(2,Math.floor(h*dpr)));
  postMat.uniforms.uAspect.value=w/h;
}
addEventListener('resize',resize); resize();

/* ---------- the loop -------------------------------------------------- */
let plateHidden=false;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,0.05); last=now;
  if(playing){
    time+=dt;
    if(time>=DUR){ time=DUR; playing=false; playBtn.textContent='Replay'; Narrator.stop(); }
  }
  const t=time;

  const shaking = (t>107.3&&t<109.5) ? (reduce?0:0.055*band(t,107.3,109.5,.3)) : 0;
  app.classList.toggle('glitch', !reduce && t>107.35 && t<109.4 && Math.sin(t*26)>-0.35);

  grade(t);
  animate(t,dt);
  aimCamera(t,shaking);
  updateTags(t);
  updateHUD(t);
  updateDip(t);
  Sound.update(t, playing);

  let ci=-1; for(let i=0;i<CAPS.length;i++) if(t>=CAPS[i][0]) ci=i;
  setCaption(ci);

  /* reduced motion keeps the piece but takes the edge off the cycling */
  let amt = (reduce ? Math.min(tripAmt,0.30) : tripAmt) * ramp(t,TRIP_ONSET,TRIP_FULL);
  const spike = (t>107.3 && t<109.6) ? band(t,107.3,109.6,.3) : 0;

  if(amt<0.02 || !rtScene){
    renderer.setRenderTarget(null);
    renderer.render(scene,camera);
  }else{
    const tp=tripAt(t);
    hueAcc += dt*tp.hue*amt*(1+spike*3);
    feedHue += dt*tp.hf*amt*0.6;
    const u=postMat.uniforms;
    u.uTime.value   = t;
    const kalIn     = clamp((amt-0.34)/0.5,0,1);
    u.uKal.value    = amt>0.34 ? Math.max(3,Math.round(tp.kal)) : 0;
    u.uKalMix.value = kalIn*0.46;
    u.uFeed.value   = tp.fb   * amt * (1+spike*0.5);
    u.uWarp.value   = tp.warp * amt * (1+spike*2.2);
    u.uChroma.value = tp.chr  * amt * (1+spike*2.6);
    u.uHue.value    = hueAcc + Math.sin(t*0.31)*tp.osc*amt;
    u.uHueFeed.value= feedHue;
    u.uSat.value    = 1+(tp.sat-1)*amt;
    u.uGain.value   = 1+amt*0.12;
    u.uZoom.value   = 1+(tp.zoom-1)*amt*(1+spike);
    u.uRot.value    = tp.rot  * amt * (1+spike*1.5);
    u.uShift.value  = spike*Math.sin(t*23);
    u.tScene.value  = rtScene.texture;
    u.tFeed.value   = rtPrev.texture;

    renderer.setRenderTarget(rtScene);
    renderer.clear();
    renderer.render(scene,camera);

    quad.material=postMat;
    renderer.setRenderTarget(rtNext);
    renderer.render(quadScene,quadCam);

    quad.material=copyMat;
    copyMat.uniforms.tDiffuse.value=rtNext.texture;
    renderer.setRenderTarget(null);
    renderer.render(quadScene,quadCam);

    const swap=rtPrev; rtPrev=rtNext; rtNext=swap;
  }

  plateHidden=true;
}
requestAnimationFrame(frame);
}catch(err){
  fail('The animation could not start: '+((err && err.message) ? err.message : String(err)));
  throw err;
}
})();
</script>

<script>
/* If the three.js module never resolves, say so rather than showing black. */
addEventListener('error', function(e){
  if(!e.error) return;                       /* ignore font/resource misses */
  var m=document.getElementById('plateMsg');
  if(m && m.className!=='err'){
    m.className='err'; m.textContent='The animation stopped: '+(e.message||'unknown error');
    var p=document.getElementById('plate'); if(p) p.classList.remove('gone');
  }
});
setTimeout(function(){
  if(!window.__booted){
    var m=document.getElementById('plateMsg');
    if(m){ m.className='err';
      m.textContent='The 3D engine could not load. Check the network connection and reload the page.'; }
  }
},9000);
</script>
